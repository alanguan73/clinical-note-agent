# 提示词案例2：查房记录丰富 → 质控不得误删有据内容（回归用）
id: D-8
name: 出院记录 · 丰富输入防误删
document_type: discharge_summary
source: 质控案例2

evidence_corpus: |
  [[当前病历]]
  入院情况::患儿因上呼吸道感染住院...
  入院诊断::1. 上呼吸道感染
  [[上级医师查房记录]]
  患儿因发热2天入院，查体咽充血、扁桃体I°肿大。
  血常规 WBC 7.66×10⁹/L，NEUT% 83%，CRP 7.84mg/L。
  呼吸道病毒核酸六项：鼻病毒阳性。
  诊断：上呼吸道感染、鼻病毒感染。
  予头孢呋辛针抗感染，退热等对症支持治疗。
  精神欠佳后好转。出院嘱避免受凉，定期复查血常规。
  [[录音记录]]
  抗感染及对症支持治疗，体温恢复正常。

writing_ai_output_good:
  入院情况: "患儿因发热2天入院，查体见咽充血、扁桃体I°肿大；血常规示WBC 7.66×10⁹/L、NEUT% 83%、CRP 7.84mg/L；呼吸道病毒核酸六项检出鼻病毒阳性。"
  入院诊断: "1. 上呼吸道感染\n2. 鼻病毒感染"
  诊疗经过: "住院期间予头孢呋辛针抗感染及退热等对症支持治疗，患者症状逐渐好转。"
  出院医嘱: "1. 注意休息，避免受凉。\n2. 定期复查血常规。"

writing_ai_output_overdelete_bad:
  入院情况: "患儿因上呼吸道感染住院，完善相关检查未见明显异常。"
  入院诊断: "1. 上呼吸道感染"

assertions:
  - compliance_errors_empty_on_good: true
  - corpus_contains_wbc_7_66: true
  - overdelete_bad_loses_numeric: true
